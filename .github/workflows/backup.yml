# Template for a dedicated operations repository, default branch automation.
# Public publication requires approval; publish only the generic package/workflow.
# Private runners require verified available included compute or approved spending.
# Not installed in .github/workflows; no schedule is activated by this commit.
# Keep the package at scripts/backup in that repository.
name: Independent staging backup
run-name: Staging backup — ${{ inputs.mode || 'backup' }}
on:
  schedule:
    # Retry opportunities; the B2 snapshot clock gates copies to twelve hours.
    - cron: "8,23,38,53 * * * *"
      timezone: "Etc/UTC"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [selftest, cadence-check, scheduled-backup, inventory, database-probe, backup, backup-packed, configuration-backup]
        default: selftest
      commission_configuration:
        description: "One-time configuration commissioning within the protected expiry window"
        type: boolean
        default: false
      configuration_probe:
        description: "Small encrypted destination-only probe without source capture or health update"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: independent-staging-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.BACKUP_RUNNER_ENABLED == 'true' && vars.BACKUP_ZERO_COST_VERIFIED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.mode != 'scheduled-backup') || vars.BACKUP_SCHEDULE_ENABLED == 'true')
    environment: backup-staging
    runs-on: ubuntu-24.04
    # Initial pack construction reads each source once; subsequent copies reuse packs.
    timeout-minutes: ${{ inputs.mode == 'backup-packed' && 90 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - working-directory: scripts/backup
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: scripts/backup
        run: npm test
      - name: Check twelve-hour snapshot cadence
        id: cadence
        if: github.event_name == 'schedule' || inputs.mode == 'cadence-check' || inputs.mode == 'scheduled-backup'
        working-directory: scripts/backup
        env:
          XFINDER_ENVIRONMENT: staging
          BACKUP_TRIGGER_CRON: ${{ github.event.schedule }}
          BACKUP_ZERO_COST_VERIFIED: ${{ vars.BACKUP_ZERO_COST_VERIFIED }}
          BACKUP_ADAPTERS_VERSION: ${{ vars.BACKUP_ADAPTERS_VERSION }}
          DATABASE_BACKUP_ENABLED: ${{ vars.DATABASE_BACKUP_ENABLED == 'true' && ((github.event_name != 'schedule' && inputs.mode != 'scheduled-backup') || vars.DATABASE_BACKUP_SCHEDULE_ENABLED == 'true') && 'true' || 'false' }}
          DATABASE_READER_URL: ${{ secrets.DATABASE_READER_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
          DATABASE_MANAGED_PUBLIC_WRITES_ACCEPTED: ${{ vars.DATABASE_MANAGED_PUBLIC_WRITES_ACCEPTED }}
          BACKUP_RECOVERY_PACKS_ENABLED: ${{ vars.BACKUP_RECOVERY_PACKS_ENABLED }}
          BACKUP_SCOPE_JSON: ${{ secrets.BACKUP_SCOPE_JSON }}
          STORAGE_READER_ID: ${{ secrets.STORAGE_READER_ID }}
          STORAGE_READER_KEY: ${{ secrets.STORAGE_READER_KEY }}
          SITES_READER_ID: ${{ secrets.SITES_READER_ID }}
          SITES_READER_KEY: ${{ secrets.SITES_READER_KEY }}
          B2_READ_KEY_ID: ${{ secrets.B2_READ_KEY_ID }}
          B2_READ_KEY: ${{ secrets.B2_READ_KEY }}
          B2_WRITE_KEY_ID: ${{ secrets.B2_WRITE_KEY_ID }}
          B2_WRITE_KEY: ${{ secrets.B2_WRITE_KEY }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: node run.mjs schedule-check
      - name: Prepare pinned database client
        if: vars.DATABASE_BACKUP_ENABLED == 'true' && inputs.mode != 'configuration-backup' && ((github.event_name != 'schedule' && inputs.mode != 'scheduled-backup') || vars.DATABASE_BACKUP_SCHEDULE_ENABLED == 'true') && (((github.event_name == 'schedule' || inputs.mode == 'scheduled-backup') && steps.cadence.outputs.due == 'true') || (github.event_name != 'schedule' && inputs.mode != 'scheduled-backup' && inputs.mode != 'selftest' && inputs.mode != 'cadence-check'))
        run: docker pull postgres@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
      - name: Run bounded staging backup
        if: ((github.event_name == 'schedule' || inputs.mode == 'scheduled-backup') && steps.cadence.outputs.due == 'true') || (github.event_name != 'schedule' && inputs.mode != 'scheduled-backup' && inputs.mode != 'selftest' && inputs.mode != 'cadence-check' && inputs.mode != 'configuration-backup')
        working-directory: scripts/backup
        env:
          XFINDER_ENVIRONMENT: staging
          BACKUP_TRIGGER_CRON: ${{ github.event.schedule }}
          BACKUP_ZERO_COST_VERIFIED: ${{ vars.BACKUP_ZERO_COST_VERIFIED }}
          BACKUP_ADAPTERS_VERSION: ${{ vars.BACKUP_ADAPTERS_VERSION }}
          DATABASE_BACKUP_ENABLED: ${{ vars.DATABASE_BACKUP_ENABLED == 'true' && ((github.event_name != 'schedule' && inputs.mode != 'scheduled-backup') || vars.DATABASE_BACKUP_SCHEDULE_ENABLED == 'true') && 'true' || 'false' }}
          DATABASE_READER_URL: ${{ secrets.DATABASE_READER_URL }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
          DATABASE_MANAGED_PUBLIC_WRITES_ACCEPTED: ${{ vars.DATABASE_MANAGED_PUBLIC_WRITES_ACCEPTED }}
          BACKUP_RECOVERY_PACKS_ENABLED: ${{ vars.BACKUP_RECOVERY_PACKS_ENABLED }}
          BACKUP_SCOPE_JSON: ${{ secrets.BACKUP_SCOPE_JSON }}
          STORAGE_READER_ID: ${{ secrets.STORAGE_READER_ID }}
          STORAGE_READER_KEY: ${{ secrets.STORAGE_READER_KEY }}
          SITES_READER_ID: ${{ secrets.SITES_READER_ID }}
          SITES_READER_KEY: ${{ secrets.SITES_READER_KEY }}
          B2_READ_KEY_ID: ${{ secrets.B2_READ_KEY_ID }}
          B2_READ_KEY: ${{ secrets.B2_READ_KEY }}
          B2_WRITE_KEY_ID: ${{ secrets.B2_WRITE_KEY_ID }}
          B2_WRITE_KEY: ${{ secrets.B2_WRITE_KEY }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          BACKUP_MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'scheduled-backup') && 'backup' || inputs.mode }}
        run: node run.mjs "$BACKUP_MODE"
      - name: Back up bounded platform configuration
        if: vars.CONFIGURATION_BACKUP_ENABLED == 'true' && (inputs.mode == 'configuration-backup' || (vars.CONFIGURATION_BACKUP_SCHEDULE_ENABLED == 'true' && (((github.event_name == 'schedule' || inputs.mode == 'scheduled-backup') && steps.cadence.outputs.due == 'true') || inputs.mode == 'backup' || inputs.mode == 'backup-packed')))
        working-directory: scripts/backup
        env:
          XFINDER_ENVIRONMENT: staging
          BACKUP_ZERO_COST_VERIFIED: ${{ vars.BACKUP_ZERO_COST_VERIFIED }}
          BACKUP_ADAPTERS_VERSION: ${{ vars.BACKUP_ADAPTERS_VERSION }}
          CONFIGURATION_BACKUP_ENABLED: "true"
          CONFIGURATION_COMMISSION_UNTIL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'configuration-backup' && inputs.commission_configuration == true && vars.CONFIGURATION_COMMISSION_UNTIL || '' }}
          CONFIGURATION_ACTION: ${{ inputs.configuration_probe == true && 'configuration-destination-probe' || 'configuration-backup' }}
          CONFIGURATION_SCOPE_JSON: ${{ secrets.CONFIGURATION_SCOPE_JSON }}
          CONFIGURATION_SUPABASE_TOKEN: ${{ secrets.CONFIGURATION_SUPABASE_TOKEN }}
          CONFIGURATION_CLOUDFLARE_TOKEN: ${{ secrets.CONFIGURATION_CLOUDFLARE_TOKEN }}
          BACKUP_SCOPE_JSON: ${{ secrets.BACKUP_SCOPE_JSON }}
          STORAGE_READER_ID: ${{ secrets.STORAGE_READER_ID }}
          STORAGE_READER_KEY: ${{ secrets.STORAGE_READER_KEY }}
          SITES_READER_ID: ${{ secrets.SITES_READER_ID }}
          SITES_READER_KEY: ${{ secrets.SITES_READER_KEY }}
          B2_READ_KEY_ID: ${{ secrets.B2_READ_KEY_ID }}
          B2_READ_KEY: ${{ secrets.B2_READ_KEY }}
          B2_WRITE_KEY_ID: ${{ secrets.B2_WRITE_KEY_ID }}
          B2_WRITE_KEY: ${{ secrets.B2_WRITE_KEY }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: node run.mjs "$CONFIGURATION_ACTION"
